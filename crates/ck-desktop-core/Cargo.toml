[package]
name = "ck-desktop-core"
version.workspace = true
edition.workspace = true
description = "Native desktop job protocol, media indexing and project persistence"

[dependencies]
anyhow = "1"
ck-core = { path = "../ck-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = ["Win32_Graphics_Dxgi", "Win32_Graphics_Dxgi_Common"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Credentials", "Win32_Storage_Packaging_Appx", "Win32_System_JobObjects", "Win32_System_LibraryLoader", "Win32_System_Threading"] }
