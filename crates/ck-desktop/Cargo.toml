[package]
name = "ck-desktop"
version.workspace = true
edition.workspace = true
description = "Native Rust desktop interface for BRP CHROMA"

[dependencies]
anyhow = "1"
ck-core = { path = "../ck-core" }
ck-desktop-core = { path = "../ck-desktop-core" }
eframe = { version = "=0.33.3", default-features = false, features = ["default_fonts", "wgpu", "x11", "wayland"] }
image = { version = "0.25", default-features = false, features = ["png"] }
libloading = "0.8"
rfd = { version = "=0.17.2", default-features = false, features = ["xdg-portal", "pollster"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[target.'cfg(target_os = "windows")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["dx12", "wgsl"] }

[target.'cfg(target_os = "macos")'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["metal", "wgsl"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
wgpu = { version = "=27.0.1", default-features = false, features = ["vulkan", "wgsl"] }

